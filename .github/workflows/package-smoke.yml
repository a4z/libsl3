name: package installation test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-integration-linux-static-system-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system sqlite dev package
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build and test installed static package
        run: |
          cmake -S . -B build/static-system \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -Dsl3_BUILD_TESTING=OFF \
            -Dsl3_USE_INTERNAL_SQLITE3=OFF \
            -Dsl3_USE_COMMON_COMPILER_WARNINGS=OFF
          cmake --build build/static-system --parallel
          cmake --install build/static-system \
            --prefix "$PWD/build/static-system/inst"
          cmake -S tests/pkg-consumer -B build/static-system-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/static-system/inst"
          cmake --build build/static-system-consumer --parallel
          ctest --test-dir build/static-system-consumer --output-on-failure

  package-integration-linux-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.1"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run shared object package smoke test
        run: ./testso.sh --config Release

  package-integration-windows-shared:
    runs-on: windows-2022
    steps:
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.1"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run shared DLL package smoke test
        shell: pwsh
        run: .\testdll.ps1 -Msvc 22 -Config Release
