name: package installation test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-integration-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system sqlite dev package
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build and stage install (system sqlite)
        run: |
          cmake -B build/installcheck/Release -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -Dsl3_BUILD_TESTING=OFF \
            -Dsl3_USE_INTERNAL_SQLITE3=OFF \
            -Dsl3_USE_COMMON_COMPILER_WARNINGS=OFF
          cmake --build build/installcheck/Release --parallel
          DESTDIR="$(pwd)/build/installcheck/inst" cmake --install build/installcheck/Release --prefix=/usr --strip

      - name: Consumer integration test against staged install
        run: |
          cmake -S tests/pkg-consumer -B build/pkg-consumer \
            -DCMAKE_PREFIX_PATH="$(pwd)/build/installcheck/inst/usr"
          cmake --build build/pkg-consumer --parallel
          ctest --test-dir build/pkg-consumer --output-on-failure

  package-integration-windows-shared:
    runs-on: windows-2022
    steps:
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.1"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and stage install (vcpkg sqlite, shared sl3)
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/installcheck/Release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_SHARED_LIBS=ON `
            -Dsl3_BUILD_TESTING=OFF `
            -Dsl3_USE_INTERNAL_SQLITE3=OFF `
            -Dsl3_USE_COMMON_COMPILER_WARNINGS=OFF
          cmake --build build/installcheck/Release --parallel
          cmake --install build/installcheck/Release --prefix "$PWD/build/installcheck/inst"

      - name: Consumer integration test against staged install
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S tests/pkg-consumer -B build/pkg-consumer -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/build/installcheck/inst" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build/pkg-consumer --parallel
          $env:PATH = "$(Resolve-Path build/installcheck/inst/bin);$env:PATH"
          ctest --test-dir build/pkg-consumer --output-on-failure
